summary: >-
  No Model Context Protocol server — hosted, remote or stdio — exists for Fusebit, and none could
  exist: Fusebit shut down in 2022, three years before MCP was published. Searched npm (@fusebit and
  @fusebit-int, 101 packages, none MCP-related), both Fusebit GitHub organizations (github.com/fusebit,
  30 repos; github.com/fivequarters, 5 repos) and the surviving release notes. The candidate tool set
  below is DERIVED from the published OpenAPI operations as a record of what an agent surface over
  this API would have covered. It is not published by Fusebit and it is not callable.
