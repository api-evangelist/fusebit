      operations: 49
      state: retired
    - version: v2
      surface: Integrations — integrations, connectors, installs, identities, sessions, tags
      spec: openapi/fusebit-http-api-integrations-openapi.yml
      operations: 40
      state: retired
  note: >-
    v1 and v2 ran concurrently on the same host; v2 added the embedded-integrations surface rather
    than superseding v1. A versioning-strategy page was published at
    fusebit.io/docs/integrator-guide/versioning and is linked from every release-notes page; that URL
    no longer resolves, so the policy text itself is unrecoverable.
