deprecation_policy:
  published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    No RFC 8594 Sunset header, no Deprecation header, and no published deprecation or end-of-life
    policy. Neither OpenAPI document marks a single operation `deprecated: true`. The only
    deprecation language in the entire surviving record is a single release-note line — "Deprecate
    official lambda node 12 runtime" (1.41.0, 2022-11-07) — which concerns a runtime, not an API
    contract.
