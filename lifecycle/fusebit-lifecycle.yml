provider: Fusebit
providerId: fusebit
status: discontinued
summary: >-
  Fusebit's API is retired. The contract, the CLI and the SDKs are still retrievable from public
  registries and from Fusebit's own GitHub orgs, but every host the platform ran on is gone from DNS,
  so nothing published here is callable. Fusebit never published a deprecation policy, a Sunset/
  Deprecation header convention, an SLA, or a status page — the retirement was silent.
