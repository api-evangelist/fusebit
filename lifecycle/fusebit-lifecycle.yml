sla:
  published: false
  note: No service-level agreement or uptime commitment survives in any reachable Fusebit document.
status_page:
  published: false
  note: >-
    No status page was found. Fusebit ran per-account Grafana health dashboards for customers
    (releases 1.40.11-1.40.18) and an internal health endpoint /v1/health/analytics, but neither is a
    public status page and neither host resolves. No StatusPage pointer is emitted.
retirement:
  state: retired
  evidence:
    - claim: The apex domain publishes no A record.
      probe: 'dig A fusebit.io @8.8.8.8'
      result: NXDOMAIN — no answer
      checked: '2026-09-10'
    - claim: Every operational subdomain is equally dark.
      probe: 'dig A for www.fusebit.io, developer.fusebit.io, api.us-west-1.on.fusebit.io, manage.fusebit.io, cdn.fusebit.io, blog.fusebit.io, everyauth.fusebit.io'
      result: NXDOMAIN on all seven
      checked: '2026-09-10'
    - claim: The domain registration is alive; only the service is gone.
      probe: 'whois fusebit.io'
      result: 'Registrar NameCheap, created 2019-04-10, registry expiry 2027-04-10, updated 2026-08-12, NS dns1/dns2.registrar-servers.com (registrar parking nameservers, zone serves no A record)'
      checked: '2026-09-10'
    - claim: The API host named by the contract is unreachable.
      probe: 'https://api.us-west-1.on.fusebit.io/v1/account/{accountId} (servers[] default region from the spec)'
      result: DNS resolution failure
      checked: '2026-09-10'
    - claim: No first-party package has shipped since early 2023.
      probe: 'registry.npmjs.org metadata for all 101 @fusebit and @fusebit-int packages'
      result: newest publish date 2023-01-11 (@fusebit-int/* all frozen at 7.53.1)
      checked: '2026-09-10'
    - claim: The last platform release predates the shutdown by years.
      probe: https://fivequarters.github.io/q5/release-notes/fusebit-http-api/
      result: 1.41.1, released 2022-11-07
      checked: '2026-09-10'
  what_survives:
    - The two OpenAPI contracts, in Fusebit's own engineering monorepo (github.com/fivequarters/q5).
    - Four dated release-note streams, served live from GitHub Pages at fivequarters.github.io/q5/release-notes/.
    - 101 first-party npm packages under @fusebit and @fusebit-int, all still installable.
    - 30 public repositories in github.com/fusebit, 7 of them archived by Fusebit.
    - The source of the fusebit.io website itself (github.com/fivequarters/fusebit.io, archived).
  what_is_gone:
    - The API (every region host).
    - The developer documentation (developer.fusebit.io and fusebit.io/docs) — the GitHub Pages mirror
      keeps release notes only; /introduction/, /reference/, /integrator-guide/ and /authoring-guide/
      on that mirror are meta-refresh stubs pointing back at the dead fusebit.io.
    - The management portal (manage.fusebit.io) and the asset CDN (cdn.fusebit.io).
    - Pricing, sign-up, terms of service, privacy policy and support channels.
