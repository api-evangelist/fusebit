image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/fusebit.png
access: 3rd-Party
position: Producing
x-status: defunct
x-status-detail: 'Platform retired after acquisition. fusebit.io is still registered (NameCheap, expiry
  2027-04-10) but its zone publishes no A record, so the apex, www, developer.fusebit.io, api.us-west-1.on.fusebit.io,
  manage.fusebit.io, cdn.fusebit.io, blog.fusebit.io and everyauth.fusebit.io all return NXDOMAIN (probed
  2026-09-10). No Website pointer is registered, on purpose: the dead one was removed rather than left
  standing as a claim. The surviving first-party surface is GitHub (github.com/fusebit, github.com/fivequarters),
  npm and the release notes at fivequarters.github.io/q5/release-notes/, all of which are registered above.'
