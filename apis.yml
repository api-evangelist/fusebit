aid: fusebit
name: Fusebit
description: 'Fusebit was a code-first, developer-facing embedded integration platform (embedded iPaaS)
  founded in Seattle in 2019, letting SaaS teams build, deploy and run third-party integrations inside
  their own products using serverless functions, managed OAuth connectors and an embeddable browser IDE.
  The company was acquired and the platform is retired: as of 2026-09-10 the domain fusebit.io is still
  registered but publishes no DNS A record, so the API, the developer documentation, the management portal
  and the asset CDN all fail to resolve. What survives is substantial and first-party — two published
  OpenAPI 3.0 contracts covering 89 operations, four dated release-note streams served from Fusebit''s
  own GitHub Pages, 101 npm packages under the @fusebit and @fusebit-int scopes, and 35 public repositories
  across the fusebit and fivequarters GitHub organizations. This profile is a historical record of a retired
  API, not a callable surface.'
