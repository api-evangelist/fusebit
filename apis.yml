apis:
- aid: fusebit:apis
  name: Fusebit HTTP API
  description: The Fusebit HTTP API managed and executed everything on the platform across two concurrent
    major versions on one host. v1 (Core, 49 operations) covered accounts, subscriptions, boundaries,
    serverless functions, users, machine clients, trusted JWT issuers, subscription storage and a private
    npm registry. v2 (Integrations, 40 operations) covered integrations, third-party credential connectors,
    per-customer installs and identities, configuration sessions and entity tags. Authentication was a
    bearer JWT minted against an issuer registered on the account, with authorization expressed as explicit
    {action, resource} grants rather than OAuth scopes. The API is retired — api.us-west-1.on.fusebit.io
    no longer resolves in DNS.
